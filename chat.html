<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KitaSehat – Chat dokter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/konsultasi.css" />
  </head>
  <body data-page="konsultasi" class="d-flex flex-column min-vh-100">
    <div id="site-header"></div>
    <main class="container py-4">
      <a href="konsultasi.html" class="fw-semibold text-decoration-none">‹ Kembali ke daftar dokter</a>

      <div class="card mx-auto mt-3 overflow-hidden" style="max-width: 760px">
        <div class="d-flex gap-3 align-items-center p-3 border-bottom">
          <div class="avatar" id="avatar">D</div>
          <div>
            <b id="nama-dokter"></b>
            <div class="text-success small">Online</div>
          </div>
        </div>
        <div id="pesan" class="chat-body p-3"></div>
        <form class="input-group p-3 border-top" id="form-chat">
          <input id="isi" class="form-control" placeholder="Tulis pesan" aria-label="Pesan"
            maxlength="500" autocomplete="off" />
          <button class="btn btn-primary">Kirim</button>
        </form>
      </div>

      <p class="text-secondary small mx-auto mt-3" style="max-width: 760px">
        Percakapan tersimpan di akunmu. Balasan dokter di versi prototipe ini masih otomatis.
        Untuk kondisi darurat, hubungi 119.
      </p>
    </main>

    <div id="site-footer" class="mt-auto pt-5"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/util.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
