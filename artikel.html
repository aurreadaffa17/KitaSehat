<!doctype html>
    <html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>KitaSehat - Artikel</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link  rel="stylesheet" href="css/base.css" />
    </head>
    <body data-page="artikel" class="d-flex flex-column min-vh-100">
        <div id="site-header"></div>
        <main class="container py-4">
            <div id="daftar">
                <h1>Artikel kesehatan</h1>
                <p class="text-secondary">Bahasa singkat, tanpa istilah rumit.</p>
                <label for="cari" class="visually-hidden">Cari artikel</label>
                <input id="cari" type="search" class="form-control mb-3" placeholder="Cari topik, misalnya tidur" />
                <div class="d-flex flex-wrap gap-2 mb-3" id="kategori"></div>
                <div class="row g-3" id="hasil"></div>
            </div>
            <article id="detail" class="mx-auto" style="max-width: 720px" hidden></article>
        </main>

        <div id="site-footer" class="mt-auto pt-5"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/util.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/cart.js"></script>
        <script src="js/layout.js"></script>
        <script src="js/data/artikel.js"></script>
        <script src="js/artikel.js"></script>
    </body>
</html>
